<!-- The browser tab, and the icon a phone keeps when the site is pinned.
     It used to be a purple-and-blue mark from the project template this
     repository started as -- nothing to do with a car hire business in
     Kanyakumari, and the one piece of the brand that follows a visitor into
     their bookmarks.
     The same geometry as the header monogram, so the tab and the page agree.
     Letters as paths, not <text>: a favicon has no page font to inherit and
     would render in whatever the browser picked. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>NiteSha Cars &amp; Bikes</title>
  <circle cx="32" cy="32" r="32" fill="#0A0E20"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
  <g transform="translate(-2 0)" fill="#D4AF37">
    <path d="M14 20h6.6l8.8 13.4V20H36v24h-6.6l-8.8-13.4V44H14z"/>
    <path d="M39.5 24.6c0-2.6 2.6-4.6 6.6-4.6h4.4v5.4h-4.4c-.5 0-.8.2-.8.6s.3.6.8.6h1.5c4 0 6.4 2.2 6.4 5.6v6.2c0 3.4-2.6 5.6-6.6 5.6H41V38.6h6.4c.5 0 .8-.2.8-.6v-1.4c0-.4-.3-.6-.8-.6H46c-4 0-6.5-2.2-6.5-5.6z"/>
  </g>
</svg>
