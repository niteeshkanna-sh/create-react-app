<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nitesha Cars — Self-drive car rental</title>
    <meta
      name="description"
      content="Self-drive car hire by the day, week or month. Clear KM limits, transparent extra-KM rates and refundable deposits, stated upfront."
    />
    <link rel="canonical" href="https://niteshacars.in/" />

    <!-- Link previews. WhatsApp, Facebook and X do not run JavaScript, so
         these have to be in the served HTML; the build writes per-route
         values into each page's copy. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nitesha Cars" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Nitesha Cars — Self-drive car rental" />
    <meta
      property="og:description"
      content="Self-drive car hire by the day, week or month. Clear KM limits, transparent extra-KM rates and refundable deposits, stated upfront."
    />
    <meta property="og:url" content="https://niteshacars.in/" />
    <meta property="og:image" content="https://niteshacars.in/hero-car.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Local search: tells Google this is a car rental business, what it is
         called, and how to reach it. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoRental",
        "name": "Nitesha Cars",
        "url": "https://niteshacars.in",
        "telephone": "+916374942976",
        "email": "niteshacars045@gmail.com",
        "image": "https://niteshacars.in/hero-car.webp",
        "priceRange": "₹₹",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "IN"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
