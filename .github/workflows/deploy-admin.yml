# Deploys the PHP admin panel to Hostinger over FTPS.
#
# The public site goes to GitHub Pages (deploy-my-app.yml). This is the other
# half: admin.niteshacars.in runs on Hostinger, which has no connection to this
# repository, so api/public-vehicles.php only reaches the server through here.
#
# Credentials live in repository secrets, never in this file:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#
#   FTP_SERVER      ftp.niteshacars.in, or whatever hPanel shows under FTP Accounts
#   FTP_USERNAME    the FTP account username
#   FTP_PASSWORD    its password
#   FTP_REMOTE_DIR  the admin folder's full path on the server, with a trailing
#                   slash, e.g. /domains/admin.niteshacars.in/public_html/admin/
#
# FTP_REMOTE_DIR is a secret rather than hard-coded here so the path is set on
# the server side by someone who can see it. Pointing this at the wrong folder
# would write admin files over the main site.
#
# NOTE: never commit a real RESET_TOKEN in tools/reset-password.php. This
# repository is public, and the file ships inert on purpose. Set the token by
# editing the file on the server, or upload it by hand when you need it.

name: Deploy admin panel

on:
  push:
    branches: [main]
    paths:
      # Deliberately not triggering on this file. Otherwise merging the
      # workflow itself fires a real deploy on the spot -- the dry run is
      # only reachable through workflow_dispatch, so the very first run
      # would write to the server before anyone had seen what it would do.
      - 'public_html/admin.niteshacars.in/admin/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would change without uploading anything'
        type: boolean
        default: true

concurrency:
  # Two deploys overlapping on one FTP account leaves a half-written panel.
  group: deploy-admin
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets are set
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          # Without this the FTP action fails deep inside itself with a
          # connection error, which reads like the server is down rather than
          # like a secret was never added.
          missing=""
          [ -n "$FTP_SERVER" ]     || missing="$missing FTP_SERVER"
          [ -n "$FTP_USERNAME" ]   || missing="$missing FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ]   || missing="$missing FTP_PASSWORD"
          [ -n "$FTP_REMOTE_DIR" ] || missing="$missing FTP_REMOTE_DIR"

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          case "$FTP_REMOTE_DIR" in
            */) ;;
            *)
              echo "::error::FTP_REMOTE_DIR must end with a slash."
              echo "Example: /domains/admin.niteshacars.in/public_html/admin/"
              exit 1
              ;;
          esac

          # FTP_SERVER is a bare host -- an IP or a hostname -- and nothing
          # else. hPanel displays it as ftp://1.2.3.4, and pasting that whole
          # string makes the FTP client look up a *hostname* of "ftp://1.2.3.4",
          # which fails as ENOTFOUND: an error that reads like the server is
          # missing rather than like the value has a prefix on it.
          #
          # Nothing below prints the value. This repository is public, so the
          # logs are public; only derived facts are reported, never the secret
          # or anything that reconstructs it.
          bad=0
          case "$FTP_SERVER" in
            *://*)  echo "::error::FTP_SERVER contains '://'. Remove the ftp:// prefix -- just the host."; bad=1 ;;
          esac
          case "$FTP_SERVER" in
            */*)    echo "::error::FTP_SERVER contains '/'. It is a host, not a URL or a path."; bad=1 ;;
          esac
          case "$FTP_SERVER" in
            *:*)    echo "::error::FTP_SERVER contains ':'. Drop the port -- 21 is the default."; bad=1 ;;
          esac
          case "$FTP_SERVER" in
            *[[:space:]]*) echo "::error::FTP_SERVER contains a space. A trailing space survives a paste and breaks the lookup."; bad=1 ;;
          esac

          echo "FTP_SERVER length: ${#FTP_SERVER} characters"
          echo "(a bare IPv4 address is 7 to 15 characters)"

          # Only hostnames get the lookup. An IP literal needs no DNS, and
          # checking one with getent is a reverse lookup that fails whenever
          # the address has no PTR record -- which is normal for shared
          # hosting, so it would reject the correct value.
          if [ "$bad" -eq 0 ]; then
            if echo "$FTP_SERVER" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
              echo "FTP_SERVER is an IP address; no lookup needed."
            elif getent hosts "$FTP_SERVER" >/dev/null 2>&1; then
              echo "FTP_SERVER resolves."
            else
              echo "::error::FTP_SERVER is neither an IP address nor a hostname DNS knows about."
              echo "Check it against hPanel -> Files -> FTP Accounts."
              bad=1
            fi
          fi

          [ "$bad" -eq 0 ] || exit 1

      - name: Make sure that folder really is the panel
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          # The deploy cannot tell an empty directory from the panel. Pointed at
          # the wrong path it does not fail -- it writes a second copy of the
          # whole admin panel into a folder nobody serves, while the real one
          # carries on working. That happened twice before this check existed,
          # and the only symptom was a 404 on a page that had just "deployed".
          #
          # config.php is the fingerprint. It holds the database password, it is
          # gitignored, and no deploy has ever written it -- so it exists in
          # exactly one place: where the panel was really installed.
          #
          # Credentials are written to a file rather than passed as arguments,
          # which would put the password in the process list.
          cfg="$(mktemp)"
          trap 'rm -f "$cfg" "$cfg.err"' EXIT
          listing=""

          # Whether a path is read from the login directory or from the
          # filesystem root depends on the account, so try both before deciding
          # the folder is wrong.
          err=""
          reached=0
          for url in "ftp://${FTP_SERVER}/${FTP_REMOTE_DIR#/}" "ftp://${FTP_SERVER}/${FTP_REMOTE_DIR}"; do
            printf 'user = "%s:%s"\nurl = "%s"\n' "$FTP_USERNAME" "$FTP_PASSWORD" "$url" > "$cfg"

            # curl's exit code and stderr are kept. Discarding them, as the first
            # version of this check did, makes a refused login, a failed TLS
            # handshake and a blocked data connection all look exactly like an
            # empty directory -- and the check then reports the folder is wrong
            # when the truth is that it never got to look.
            # --insecure encrypts the connection but does not verify the
            # server's certificate. That is a real weakening and it is worth
            # being explicit about why it is here: this host presents a
            # certificate curl will not validate, and the deploy step below
            # completes FTPS against it regardless -- so the upload, carrying
            # the same credentials, already crosses an unverified channel.
            # A check that is stricter than the deploy it guards blocks work
            # without protecting anything; it did exactly that on its first
            # run, reporting a folder as missing when it had simply been
            # refused the handshake.
            #
            # The fix that would let this be strict is a valid certificate on
            # the FTP host, which is Hostinger's to provide.
            set +e
            listing="$(curl --silent --show-error --ssl-reqd --insecure --list-only \
                            --connect-timeout 20 --max-time 60 \
                            --config "$cfg" 2>"$cfg.err")"
            rc=$?
            set -e
            [ "$rc" -eq 0 ] && reached=1
            [ "$rc" -eq 0 ] || err="$(cat "$cfg.err")"

            if printf '%s' "$listing" | grep -qx 'config.php'; then
              echo "Found config.php. This is the panel."
              exit 0
            fi
          done

          if [ "$reached" -eq 0 ]; then
            echo "::error::Could not read that folder over FTPS, so whether it is the panel is unknown."
            echo ""
            echo "This is not the same as the folder being wrong -- nothing was listed"
            echo "because the listing itself failed. curl said:"
            echo ""
            printf '%s\n' "${err:-(no error text)}" | head -10 | sed 's/^/  /'
            echo ""
            echo "Refusing to deploy on an unverified folder, since deploying into the"
            echo "wrong one leaves a copy of the panel where nobody serves it."
            exit 1
          fi

          echo "::error::FTP_REMOTE_DIR does not contain config.php, so it is not the admin panel."
          echo ""
          echo "Deploying here would leave a second copy of the panel in a folder"
          echo "nobody serves, and the live site would be unchanged."
          echo ""
          echo "In hPanel's File Manager, find the folder containing config.php."
          echo "That file is never deployed, so it exists only where the panel was"
          echo "installed. That folder is what this secret should name."
          echo ""
          if [ -z "$listing" ]; then
            echo "Nothing could be listed at that path; it may not exist."
          else
            echo "What is there instead:"
            printf '%s\n' "$listing" | head -20 | sed 's/^/  /'
          fi
          exit 1

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public_html/admin.niteshacars.in/admin/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

          # Leaves files the action never uploaded alone. Turning this on would
          # wipe the folder first and take config.php with it -- the panel would
          # stop with "Not set up yet" and the database credentials on the
          # server would be gone.
          dangerous-clean-slate: false

          # Everything below is either untracked on purpose or meaningless on a
          # web server. config.php is the important one: it holds the live
          # database password, which is why it is not in git.
          exclude: |
            config.php
            .ftp-deploy-sync-state.json
            **/.git*
            **/.git*/**
            **/.DS_Store
